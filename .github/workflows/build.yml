name: Build APK

on:
  push:
    branches: [ primary ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android SDK packages
      run: |
        # Принимаем лицензии
        yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        # Устанавливаем платформу и инструменты
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Verify SDK
      run: |
        echo "Installed SDK packages:"
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT --list | grep -E "platform-tools|platforms;android-33|build-tools;33.0.2"

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
