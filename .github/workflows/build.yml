name: Build Android APK with CMake 3.31.6

on:
  push:
    branches:
      - primary
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    - name: Install CMake 3.31.6 manually
      run: |
        wget https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
        tar -xzvf cmake-3.31.6-linux-x86_64.tar.gz
        sudo mv cmake-3.31.6-linux-x86_64 /opt/cmake-3.31.6
        sudo ln -sf /opt/cmake-3.31.6/bin/* /usr/local/bin/
        cmake --version

    - name: Setup Android SDK and Build Tools
      uses: android-actions/setup-android@v4
      with:
        api-level: 33
        build-tools-version: 33.0.2

    - name: Accept SDK licenses
      run: yes | sdkmanager --licenses

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
